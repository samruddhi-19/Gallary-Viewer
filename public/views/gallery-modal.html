<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Modal</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/gallery-modal.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div class="gallery-container">
    <!-- Top Bar -->
    <header class="gallery-header">
      <div class="gallery-title">
        <span id="gallery-card-name">Image Gallery</span>
        <span id="gallery-counter" class="counter-badge">0 / 0</span>
      </div>
      <div class="gallery-actions">
        <button id="btn-toggle-grid" class="icon-btn" title="Toggle Grid / Lightbox">⊞</button>
        <button id="btn-zoom-in" class="icon-btn" title="Zoom In">🔍+</button>
        <button id="btn-zoom-out" class="icon-btn" title="Zoom Out">🔍-</button>
        <button id="btn-slideshow" class="icon-btn" title="Play / Pause Slideshow">▶</button>
        <button id="btn-download" class="icon-btn" title="Download Image">⬇</button>
        <button id="btn-close" class="icon-btn" title="Close Gallery">✕</button>
      </div>
    </header>

    <!-- Main Lightbox Stage -->
    <main id="lightbox-view" class="lightbox-stage">
      <button id="nav-prev" class="nav-arrow nav-prev" title="Previous Image">‹</button>
      <img id="main-image" class="lightbox-main-img" src="" alt="Gallery Image" style="display: none;">
      <button id="nav-next" class="nav-arrow nav-next" title="Next Image">›</button>

      <!-- Empty state placeholder if no images found -->
      <div id="empty-state" class="empty-gallery" style="display: none;">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>No image attachments found on this card.</p>
      </div>
    </main>

    <!-- Grid View Stage -->
    <div id="grid-view" class="gallery-grid">
      <!-- Grid items injected dynamically -->
    </div>

    <!-- Bottom Thumbnail Strip -->
    <footer id="thumbnail-strip" class="thumbnail-strip">
      <!-- Thumbnails injected dynamically -->
    </footer>
  </div>

  <script src="../js/trello-api.js"></script>
  <script src="../js/gallery-modal.js"></script>
</body>
</html>
