<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/board-gallery.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div class="modal-frame" role="dialog" aria-label="Board media gallery">

    <!-- Header -->
    <header class="head">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L6 21"/></svg>
        </div>
        <div class="titles">
          <h1>Gallery Viewer</h1>
          <p id="boardTitle">Loading board...</p>
        </div>
      </div>
      <div class="spacer"></div>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search by file or card name" aria-label="Search images">
      </label>
      <button class="btn primary" id="attach">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Attach image
      </button>
      <button class="btn icon" id="settingsBtn" aria-pressed="false" aria-label="Display settings" title="Display settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </header>

    <!-- Filter Toolbar -->
    <div class="bar">
      <!-- Lists Dropdown -->
      <select id="listSelect" class="chip-select" aria-label="Filter by list">
        <option value="all">All lists</option>
      </select>

      <!-- Labels Dropdown -->
      <select id="labelSelect" class="chip-select" aria-label="Filter by label">
        <option value="all">All labels</option>
      </select>

      <div class="divider"></div>

      <!-- Date Range Filter -->
      <div class="seg" role="radiogroup" aria-label="Date range" id="dateSeg">
        <button role="radio" aria-checked="true" data-v="all">All time</button>
        <button role="radio" aria-checked="false" data-v="today">Today</button>
        <button role="radio" aria-checked="false" data-v="week">This week</button>
        <button role="radio" aria-checked="false" data-v="month">This month</button>
      </div>

      <button class="reset" id="reset" hidden>Clear filters</button>
      <div class="spacer"></div>
      <span class="count" id="count"></span>
    </div>

    <!-- Main Content Area -->
    <div class="body">
      <div class="scroll" id="scroll"></div>

      <!-- Settings Drawer -->
      <aside class="drawer" id="drawer" aria-label="Display settings">
        <h2>Display settings</h2>
        <p class="sub">Changes apply to the gallery right away.</p>

        <div class="field">
          <label for="col">Column width <output id="colOut">260 px</output></label>
          <input id="col" type="range" min="160" max="420" step="10" value="260">
        </div>
        <div class="field">
          <label for="gx">Horizontal gap <output id="gxOut">16 px</output></label>
          <input id="gx" type="range" min="0" max="48" step="2" value="16">
        </div>
        <div class="field">
          <label for="gy">Vertical gap <output id="gyOut">16 px</output></label>
          <input id="gy" type="range" min="0" max="48" step="2" value="16">
        </div>

        <div class="group">
          <div class="field">
            <div class="lbl">Caption shows</div>
            <div class="seg full" role="radiogroup" id="titleSeg" aria-label="Caption">
              <button role="radio" aria-checked="true" data-v="both">Both</button>
              <button role="radio" aria-checked="false" data-v="card">Card</button>
              <button role="radio" aria-checked="false" data-v="file">File</button>
              <button role="radio" aria-checked="false" data-v="none">None</button>
            </div>
          </div>
          <div class="field">
            <div class="lbl">Show captions</div>
            <div class="seg full" role="radiogroup" id="revealSeg" aria-label="When to show captions">
              <button role="radio" aria-checked="false" data-v="hover">On hover</button>
              <button role="radio" aria-checked="true" data-v="always">Always</button>
            </div>
          </div>
        </div>
        <button class="btn" id="defaults" style="width:100%;justify-content:center">Restore defaults</button>
      </aside>

      <!-- Lightbox Preview Modal -->
      <div class="lb" id="lb" role="dialog" aria-label="Image preview">
        <button class="lbclose" id="lbClose" aria-label="Close preview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button class="nav" id="prev" aria-label="Previous image" style="grid-column:1;grid-row:1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
        <div class="stagepic" id="lbPic"></div>
        <button class="nav" id="next" aria-label="Next image" style="grid-column:3;grid-row:1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button>
        <div class="info">
          <div>
            <h3 id="lbTitle"></h3>
            <p id="lbMeta"></p>
          </div>
          <div class="spacer"></div>
          <button class="btn" id="lbOpen">Open card</button>
          <button class="btn primary" id="lbDl" type="button">Download</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/trello-api.js"></script>
  <script src="../js/board-gallery.js"></script>
</body>
</html>
