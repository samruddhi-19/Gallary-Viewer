<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Settings</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/settings.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div class="settings-container">
    <div class="settings-group">
      <label class="settings-label" for="default-view">Default View</label>
      <span class="settings-description">Choose how you prefer cards to display images first</span>
      <select id="default-view" class="settings-select">
        <option value="lightbox">Lightbox (Single Image Focus)</option>
        <option value="grid">Grid (Overview Thumbnail Gallery)</option>
      </select>
    </div>

    <div class="settings-group">
      <label class="settings-label" for="slideshow-speed">Slideshow Speed (seconds)</label>
      <input type="number" id="slideshow-speed" class="settings-input" min="1" max="30" value="3.5" step="0.5" />
    </div>

    <div class="settings-checkbox-row">
      <input type="checkbox" id="autoplay-enabled" />
      <label for="autoplay-enabled" class="settings-label" style="font-weight: normal; cursor: pointer;">
        Autoplay slideshow on modal open
      </label>
    </div>

    <div class="settings-footer">
      <button id="btn-save" class="btn-primary">Save Preferences</button>
    </div>
  </div>

  <script src="../js/settings.js"></script>
</body>
</html>
